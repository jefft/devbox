version: "0.5"

processes:
  mariadb:
    # DEVBOX_* are the structural directories of this plugin's includable,
    # rendered by devbox when this file is materialized (create_files runs
    # the Go template per includable). They override inherited env; the
    # plugin's own *_* env vars remain the user-tunable knobs.
    environment:
      - DEVBOX_DEV_DIR={{ .DevboxDir }}
      - DEVBOX_LOG_DIR={{ .LogDir }}
      - DEVBOX_DATA_DIR={{ .DataDir }}
      - DEVBOX_RUNTIME_DIR={{ .RuntimeDir }}
      - DEVBOX_VIRTENV={{ .Virtenv }}
      - DEVBOX_PROJECT_DIR={{ .DevboxProjectDir }}
    command: "echo 'Starting mariadbd... check mariadb_logs for details'; mariadbd --log-error={{ .LogDir }}/mysql.log"
    is_daemon: false
    shutdown:
      command: "mariadb-admin -u root shutdown"
    availability:
      restart: "always"
    readiness_probe:
      exec:
        command: "mariadb-admin ping"
      initial_delay_seconds: 2
  mariadb_logs:
    command: "tail -f {{ .LogDir }}/mysql.log"
    availability:
      restart: "always"
