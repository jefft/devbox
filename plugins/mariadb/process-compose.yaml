version: "0.5"

processes:
  mariadb:
    command: "mkdir -p -m 700 \"$(dirname \"$MYSQL_UNIX_PORT\")\"; echo 'Starting mariadbd... check mariadb_logs for details'; mariadbd --log-error={{ .LogDir }}/mysql.log"
    is_daemon: false
    shutdown:
      command: "mariadb-admin -u root shutdown"
    availability:
      restart: "always"
    readiness_probe:
      exec:
        command: "mariadb-admin ping"
      initial_delay_seconds: 2
  mariadb_logs:
    command: "tail -f {{ .LogDir }}/mysql.log"
    availability:
      restart: "always"
