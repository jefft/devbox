version: "0.5"

processes:
  mysql:
    command: "mkdir -p -m 700 \"$(dirname \"$MYSQL_UNIX_PORT\")\"; echo 'Starting mysqld... check mysql_logs for details'; mysqld --log-error={{ .LogDir }}/mysql.log"
    is_daemon: false
    shutdown:
      command: "mysqladmin -u root shutdown"
    availability:
      restart: "always"
    depends_on:
      mysql_logs:
        condition: "process_started"
    readiness_probe:
      exec:
        command: "mysqladmin ping"
      initial_delay_seconds: 2
  mysql_logs:
    command: "tail -f {{ .LogDir }}/mysql.log"
    availability:
      restart: "always"
