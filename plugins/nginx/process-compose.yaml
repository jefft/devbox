version: "0.5"

processes:
  nginx:
    # DEVBOX_* are the structural directories of this plugin's includable,
    # rendered by devbox when this file is materialized (create_files runs
    # the Go template per includable). They override inherited env; the
    # plugin's own *_* env vars remain the user-tunable knobs.
    environment:
      - DEVBOX_DEV_DIR={{ .DevboxDir }}
      - DEVBOX_LOG_DIR={{ .LogDir }}
      - DEVBOX_DATA_DIR={{ .DataDir }}
      - DEVBOX_RUNTIME_DIR={{ .RuntimeDir }}
      - DEVBOX_VIRTENV={{ .Virtenv }}
      - DEVBOX_PROJECT_DIR={{ .DevboxProjectDir }}
    command: |
      mkdir -p "$DEVBOX_LOG_DIR"
      if [ -f $DEVBOX_DEV_DIR/nginx.template ]; then envsubst $(awk 'BEGIN {for (k in ENVIRON) {printf "$"k","}}') < $DEVBOX_DEV_DIR/nginx.template > $DEVBOX_DEV_DIR/nginx.conf; fi
      nginx -p $DEVBOX_VIRTENV -c $DEVBOX_DEV_DIR/nginx.conf -e $DEVBOX_LOG_DIR/nginx-error.log -g "pid nginx.pid;daemon off;"
    availability:
      restart: on_failure
      max_restarts: 5
    readiness_probe:
      http_get:
        host: localhost
        port: ${NGINX_WEB_PORT}
        path: /
      initial_delay_seconds: 1
  nginx-error:
    # DEVBOX_* are the structural directories of this plugin's includable,
    # rendered by devbox when this file is materialized (create_files runs
    # the Go template per includable). They override inherited env; the
    # plugin's own *_* env vars remain the user-tunable knobs.
    environment:
      - DEVBOX_DEV_DIR={{ .DevboxDir }}
      - DEVBOX_LOG_DIR={{ .LogDir }}
      - DEVBOX_DATA_DIR={{ .DataDir }}
      - DEVBOX_RUNTIME_DIR={{ .RuntimeDir }}
      - DEVBOX_VIRTENV={{ .Virtenv }}
      - DEVBOX_PROJECT_DIR={{ .DevboxProjectDir }}
    command: "tail -f $DEVBOX_LOG_DIR/nginx-error.log"
    availability:
      restart: "always"
  nginx-access:
    # DEVBOX_* are the structural directories of this plugin's includable,
    # rendered by devbox when this file is materialized (create_files runs
    # the Go template per includable). They override inherited env; the
    # plugin's own *_* env vars remain the user-tunable knobs.
    environment:
      - DEVBOX_DEV_DIR={{ .DevboxDir }}
      - DEVBOX_LOG_DIR={{ .LogDir }}
      - DEVBOX_DATA_DIR={{ .DataDir }}
      - DEVBOX_RUNTIME_DIR={{ .RuntimeDir }}
      - DEVBOX_VIRTENV={{ .Virtenv }}
      - DEVBOX_PROJECT_DIR={{ .DevboxProjectDir }}
    command: "tail -f $DEVBOX_LOG_DIR/nginx-access.log"
    availability:
      restart: "always"
