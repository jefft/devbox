[global]
pid = ${PHPFPM_PID_FILE}
; Note: this is PHP-FPM's error log, not PHP's (see below)
error_log = ${PHPFPM_ERROR_LOG_FILE}
daemonize = yes

[www]
; user = www-data
; group = www-data
; PHP-FPM listens on a unix socket rather than TCP (cf. the mariadb plugin's
; MYSQL_UNIX_PORT). The socket path comes from the PHPFPM_UNIX_SOCKET env var,
; set by this plugin (default: .devbox/virtenv/php/php-fpm.sock). Override it in
; devbox.json if you need a different location; unix socket paths are limited
; to ~107 characters.
;
; Backward compatibility: if PHPFPM_PORT is set, the php-fpm process-compose
; shim points PHPFPM_UNIX_SOCKET at 127.0.0.1:$PHPFPM_PORT (TCP mode) so
; external tools connecting to the port keep working.
listen = ${PHPFPM_UNIX_SOCKET}
; listen.owner = www-data
; listen.group = www-data
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
chdir = /

; Note: PHP's error_log() output is typically found in your webserver error log, not in PHP-FPM's. By default error_log() writes to stderr (unless 'error_log' is set in php.log), and then on to the FastCGI client (the webserver), which logs it. If you want error_log() logged at the PHP-FPM layer, set a file here:
;
; php_admin_value[error_log] = ...
; php_admin_flag[log_errors] = on

